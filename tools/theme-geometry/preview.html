<!doctype html>
<html lang="en">
	<meta charset="UTF-8" /><title>Theme geometry comparison</title>
	<link rel="stylesheet" href="/packages/themes/oren/dist/index.css" />
	<style>
		body {
			margin: 0;
			font:
				16px/1.5 Arial,
				sans-serif;
			background: var(--so-place-surface, white);
			color: var(--so-component-text, #222);
		}
		main {
			padding: 24px;
		}
		h1 {
			font-size: 24px;
			margin: 0 0 12px;
		}
		h2 {
			font-size: 17px;
			margin: 0 0 12px;
		}
		.matrix {
			display: grid;
			grid-template-columns: repeat(5, minmax(0, 1fr));
			gap: 20px;
		}
		.cell {
			min-width: 0;
			display: flex;
			flex-direction: column;
			align-items: stretch;
			gap: 18px;
		}
		.cell .so-input,
		.cell .so-date-input,
		.cell .so-textarea {
			width: 100%;
			min-width: 0;
		}
		section {
			margin-bottom: 32px;
		}
		.sample-icon {
			width: 1em;
			height: 1em;
			display: block;
		}
	</style>
	<main id="app"></main>
	<script type="module" src="./preview.ts"></script>
</html>
